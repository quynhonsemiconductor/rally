# =============================================================================
# CI — fast quality gates on every PR and push to main
# Gate: lint → typecheck → unit tests → e2e tests → docker build → openapi diff
# Security scans live in the Security · Scan workflow — independently runnable.
# =============================================================================
name: Backend · CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # NOT `edited`. That action exists only for the PR-title check, which now lives in
    # pr-title.yml — and listening for it here was actively harmful: combined with
    # `cancel-in-progress: true` below and the `if: action != 'edited'` guards this workflow
    # used to carry, editing a PR title or body CANCELLED the in-flight real run and replaced
    # it with one where every heavy job skipped. GitHub counts a skipped required check as
    # passing, so the PR went green having executed nothing. Every run of this workflow is now
    # a real one.
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # No longer for the semantic-PR action — that moved to pr-title.yml, which declares its
  # own. Kept because it is read-only and removing a permission is a bigger claim than
  # this change is making: nothing here needs it today (the openapi job reads
  # `github.event.pull_request.base.sha` straight off the payload, which needs no grant).
  pull-requests: read
  packages: read       # pull @quynhonsemiconductor/* from GitHub Packages

env:
  # 24, matching .nvmrc and the Dockerfile's `ARG NODE_VERSION=24`. Nothing overrides that
  # ARG, so the shipped image runs 24 — while CI ran 22, meaning no suite ever executed on
  # the version production uses. A Node-24-only failure would have had no failing test to
  # point at.
  #
  # Node 24's V8 coverage instrumentation counts functions differently, so the bump was
  # MEASURED against the thresholds below before being made rather than assumed safe. On 24:
  # statements 82.30 / branches 77.09 / functions 81.49 / lines 82.88, against floors of
  # 81 / 76 / 80 / 82 — all four clear, but by only 0.88 to 1.49 points.
  #
  # That thin margin is the ratchet working as intended (floors just under actual), not a
  # warning — but it does mean a change that drops real coverage by a point turns Tests red
  # rather than drifting. Raise the floors with coverage, never the reverse.
  NODE_VERSION: '24'
  PNPM_VERSION: '10.33.2'

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Lint + typecheck (fast gate — no DB needed)
  # ─────────────────────────────────────────────────────────────────────────
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Authenticates pnpm against GitHub Packages for @quynhonsemiconductor/* (see .npmrc).
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Lint
        run: pnpm lint

      - name: Typecheck (shipped sources)
        run: npx tsc -p tsconfig.build.json --noEmit

      - name: Typecheck (including tests)
        # `tsconfig.build.json` excludes `**/*spec.ts`, `**/*.test.ts` and `test/**`, so
        # the step above cannot see a type error in a test file. That is how a wrong
        # service-call signature reached main in #262 behind a green check: the spec still
        # PASSED at runtime, so nothing else caught it either. `tsconfig.json` is a
        # superset, hence both steps rather than a replacement — the first one stays as
        # the fast gate that matches exactly what the Docker build compiles.
        run: pnpm typecheck

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Unit + e2e tests (needs Postgres + Redis)
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Authenticates pnpm against GitHub Packages for @quynhonsemiconductor/* (see .npmrc).
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rally_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Generate a fresh ephemeral EC P-256 keypair for tests (matches ES256 in platform.module.ts).
      # No stored secret needed — keys are test-only, discarded after the run.
      - name: Generate CI JWT keypair
        id: jwt
        run: |
          node - << 'EOF'
          const { generateKeyPairSync } = require('crypto');
          const { privateKey, publicKey } = generateKeyPairSync('ec', {
            namedCurve: 'P-256',
            privateKeyEncoding: { type: 'pkcs8', format: 'pem' },
            publicKeyEncoding:  { type: 'spki',  format: 'pem' },
          });
          const b64 = (s) => Buffer.from(s).toString('base64');
          const fs  = require('fs');
          fs.appendFileSync(process.env.GITHUB_ENV,
            `CI_JWT_PRIVATE_KEY=${b64(privateKey)}\nCI_JWT_PUBLIC_KEY=${b64(publicKey)}\n`);
          EOF

      - name: Run migrations
        run: pnpm db:migrate
        env:
          DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/rally_test?sslmode=disable
          # db:migrate also runs seedTenantBootstrap, which only creates the
          # primary Entra SSO connection when ENTRA_TENANT_ID is set. The SSO
          # → RBAC e2e (test/e2e/sso-rbac.e2e.spec.ts) needs that connection to
          # resolve a workspace, so seed it here. Values mirror .env.
          ENTRA_TENANT_ID: dev-tenant
          SSO_ALLOWED_EMAIL_DOMAINS: qnsc.vn

      - name: Unit tests (with coverage)
        run: pnpm test:cov
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rally_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          JWT_PRIVATE_KEY: ${{ env.CI_JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ env.CI_JWT_PUBLIC_KEY }}
          JWT_ISSUER: rally-api
          JWT_AUDIENCE: rally-web
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 30d
          CSRF_SECRET: ci-test-csrf-secret-min-32-characters-ok
          COOKIE_SECRET: ci-test-cookie-secret-min-32-characters-ok

      # Coverage floors used to be manual discipline only, and it slipped: they sat ~11 points
      # under real coverage for two phases (70/66/62/70 against 82/77/81/83), so a ten-point
      # regression would have passed unnoticed — a ratchet that trails that far measures
      # nothing (see "Coverage is a ratchet, not a target" in CLAUDE.md). Ported from opshub's
      # `check:coverage-floors`, which guards the same class of drift there: this fails when
      # any floor in vitest.config.ts falls more than 3 points behind measured coverage.
      # Reads the json-summary report the step above just wrote, so it never runs coverage
      # twice.
      - name: Coverage floors track actual coverage
        run: pnpm check:coverage-floors

      # The BA flow e2e specs boot the real AppModule with a synthetic admin
      # actor (no SSO login), so they need the demo admin to already be an
      # active workspace member. That row is created by the full seed, not by
      # db:migrate's minimal seedTenantBootstrap. Run the same seed devs use
      # locally so CI ↔ local share one fixture source of truth. Idempotent.
      - name: Seed e2e fixtures
        run: pnpm db:seed:test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rally_test?sslmode=disable
          ENTRA_TENANT_ID: dev-tenant
          SSO_ALLOWED_EMAIL_DOMAINS: qnsc.vn

      # Prove the least-privilege grants from migration 0068 are COMPLETE, by
      # running the whole e2e suite as `rova_app` instead of the superuser.
      #
      # Without this the split is untested: every job above connects as
      # `postgres`, which owns everything, so a schema or sequence the migration
      # forgot to GRANT passes CI and only fails after the production cutover —
      # as a boot-time or first-write `permission denied for …`. The roles are
      # created NOLOGIN, so CI grants LOGIN here; nothing else changes.
      # Same script the deployed cutover runs as a one-off migrator task, so what
      # CI exercises here is the code path production uses (see
      # docs/runbooks/db-role-least-privilege.md). Only DATABASE_APP_PASSWORD is
      # set: `rova_worker` is skipped because nothing in the e2e suite connects
      # as it.
      - name: Enable the least-privilege role for the e2e run
        run: pnpm db:roles:enable
        env:
          DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/rally_test?sslmode=disable
          DATABASE_APP_PASSWORD: rova_app

      - name: E2E tests
        run: pnpm test:e2e
        env:
          NODE_ENV: test
          # The APP connects as the restricted role, the MIGRATOR as the owner —
          # the same split infra/modules/stack/main.tf gets at cutover.
          DATABASE_URL: postgresql://rova_app:rova_app@localhost:5432/rally_test?sslmode=disable
          DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/rally_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          JWT_PRIVATE_KEY: ${{ env.CI_JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ env.CI_JWT_PUBLIC_KEY }}
          JWT_ISSUER: rally-api
          JWT_AUDIENCE: rally-web
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 30d
          CSRF_SECRET: ci-test-csrf-secret-min-32-characters-ok
          COOKIE_SECRET: ci-test-cookie-secret-min-32-characters-ok
          # Entra BFF OIDC — CI test-only placeholders (never used for real auth).
          # ENTRA_TENANT_ID matches the SSO connection seeded during migrations so
          # the SSO → RBAC e2e resolves its workspace; PLATFORM_ADMIN_EMAILS drives
          # the admin-elevation assertion. Both mirror .env.
          ENTRA_TENANT_ID: dev-tenant
          ENTRA_CLIENT_ID: ci-test-client
          ENTRA_CLIENT_SECRET: ci-test-secret
          ENTRA_REDIRECT_URI: http://localhost:3000/v1/bff/callback
          SSO_ALLOWED_EMAIL_DOMAINS: qnsc.vn
          PLATFORM_ADMIN_EMAILS: nghiavt@qnsc.vn
          # The suite shares ONE authenticated principal (admin@qnsc.dev) across 49 files, and the
          # DEFAULT rate-limit tier is 100 requests per 60s keyed by `uid:{sub}`. So the limiter is
          # a shared budget that every spec spends from, and adding assertions anywhere can push an
          # unrelated file over it — `task-routes.e2e.spec.ts` started returning 429 where it
          # expected 200/404 after ~24 requests were added to another file.
          #
          # Nothing in this suite tests rate limiting, so there is no coverage to lose. It also
          # removes a local/CI divergence that hid the problem: `.env` sets this true, so the suite
          # passes locally and only fails here. `web-ci.yml` already does the same for Playwright.
          DISABLE_RATE_LIMIT: 'true'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Migration upgrade path — proves new migrations apply on top of an
  #    EXISTING (main) database, i.e. the real path develop/prod take.
  #
  #    The `test` job migrates a FRESH, empty DB. That can never catch a whole
  #    class of failures — most notably `ALTER TYPE … ADD VALUE` followed by a
  #    use of that value in the same batch: on an empty DB the enum type is
  #    CREATEd in the same transaction, which Postgres permits; on a real DB the
  #    type is already committed, so the same batch aborts with 55P04. Drizzle
  #    runs all pending migrations in one transaction, so this bites every
  #    incremental deploy but stays invisible to a from-scratch test.
  #
  #    Strategy: apply main's migrations first and COMMIT them (baseline), then
  #    apply only the migrations this PR adds on top. A migration that can't
  #    upgrade a prod-like database fails here — before it can reach main.
  # ─────────────────────────────────────────────────────────────────────────
  migrations:
    name: Migration upgrade path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/rally_upgrade?sslmode=disable

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rally_upgrade
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # need origin/main to build the baseline schema
          persist-credentials: false

      # Expand-contract advisory (WARN-only): migrate-before-flip runs the new
      # migration while the OLD app is briefly still live, so backward-
      # incompatible DDL (drop/rename/narrow a column) can break it. Flag such
      # DDL in this PR's new migration lines via GHA annotations — never fails
      # the build. Acknowledge a deliberate one with a trailing
      # `-- expand-contract-ok: <reason>` on the line.
      # TODO: flip to blocking before the first production project goes live.
      - name: Expand-contract advisory
        if: github.event_name == 'pull_request'
        run: |
          added=$(git diff origin/main...HEAD -- 'db/migrations/*.sql' \
            | grep -E '^\+' | grep -vE '^\+\+\+' || true)
          if [ -z "$added" ]; then echo "No new migration lines."; exit 0; fi
          pattern='DROP[[:space:]]+COLUMN|DROP[[:space:]]+TABLE|RENAME[[:space:]]+(COLUMN|TO)|SET[[:space:]]+NOT[[:space:]]+NULL'
          hits=$(echo "$added" | grep -iE "$pattern" | grep -iv 'expand-contract-ok' || true)
          if [ -n "$hits" ]; then
            echo "$hits" | while IFS= read -r line; do
              echo "::warning title=Expand-contract::Backward-incompatible DDL — verify migrate-before-flip safe: ${line#+}"
            done
          else
            echo "No backward-incompatible DDL detected."
          fi

      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Baseline: check out main's ENTIRE db/ tree (migrations, seed AND the
      # Drizzle schema) and run it end-to-end, so the DB mirrors a real deployed
      # environment exactly as the last release produced it. Then restore this
      # PR's files. Pinning the whole tree — not just db/migrations — is
      # essential because `db:migrate` also runs the seed, and the seed builds
      # its INSERTs from the Drizzle schema: a PR that adds a column or changes
      # an ON CONFLICT target would otherwise run HEAD's seed/schema against
      # main's older tables and fail spuriously.
      # (On push-to-main this is a no-op: origin/main == HEAD.)
      - name: Apply baseline (main) migrations
        run: |
          git checkout origin/main -- db
          pnpm db:migrate
          git checkout HEAD -- db

      # Upgrade: apply only the migrations this PR adds, on the committed
      # baseline. Reproduces the committed-enum restriction and any other
      # incremental-only hazard; fails the PR if the upgrade can't complete.
      - name: Apply new migrations on top of baseline
        run: pnpm db:migrate

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Docker build validation (BuildKit cache, no push)
  #    Runs after tests to avoid wasting compute on broken code.
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [quality, test]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      # Build all three targets — fail fast if any stage breaks.
      - name: Build api image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          # BuildKit secret consumed by the deps/prod-deps stages to auth
          # pnpm against GitHub Packages for @quynhonsemiconductor/* (never baked into a layer).
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}

      - name: Build migrator image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          target: migrator
          push: false
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}

      - name: Build worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          target: worker
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────
  # 4. OpenAPI spec — generate and check for breaking changes on PRs.
  #    Publishes the spec as an artifact so the FE repo can download it.
  # ─────────────────────────────────────────────────────────────────────────
  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 20
    env:
      # Authenticates pnpm against GitHub Packages for @quynhonsemiconductor/* (see .npmrc).
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rally_openapi
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Fetch full history so we can compare against the base branch
          fetch-depth: 0
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Generate ephemeral JWT keys
        run: |
          node - << 'EOF'
          const { generateKeyPairSync } = require('crypto');
          const { privateKey, publicKey } = generateKeyPairSync('ec', {
            namedCurve: 'P-256',
            privateKeyEncoding: { type: 'pkcs8', format: 'pem' },
            publicKeyEncoding:  { type: 'spki',  format: 'pem' },
          });
          const b64 = (s) => Buffer.from(s).toString('base64');
          const fs  = require('fs');
          fs.appendFileSync(process.env.GITHUB_ENV,
            `CI_JWT_PRIVATE_KEY=${b64(privateKey)}\nCI_JWT_PUBLIC_KEY=${b64(publicKey)}\n`);
          EOF

      - name: Run migrations
        run: pnpm db:migrate
        env:
          DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/rally_openapi?sslmode=disable

      - name: Build app
        run: pnpm build:api

      - name: Start API and capture OpenAPI spec
        run: |
          node dist/apps/api/apps/api/src/main.js &
          API_PID=$!
          echo "API_PID=$API_PID" >> "$GITHUB_ENV"
          # Wait for the API to be ready (up to 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/v1/healthz > /dev/null 2>&1; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/api/docs-json -o openapi.json
          kill $API_PID 2>/dev/null || true
          # Guard the opt-in above: a disabled Swagger returns 404 and would
          # otherwise leave an empty/absent spec for the breaking-change check.
          test -s openapi.json
        env:
          NODE_ENV: development
          PORT: 3000
          # The spec is only served when Swagger is explicitly enabled (it no
          # longer piggybacks on NODE_ENV), so this job must opt in.
          SWAGGER_ENABLED: 'true'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rally_openapi?sslmode=disable
          REDIS_URL: redis://localhost:6379
          JWT_PRIVATE_KEY: ${{ env.CI_JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ env.CI_JWT_PUBLIC_KEY }}
          JWT_ISSUER: rally-api
          JWT_AUDIENCE: rally-web
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 30d
          CSRF_SECRET: ci-test-csrf-secret-min-32-characters-ok
          COOKIE_SECRET: ci-test-cookie-secret-min-32-characters-ok
          OTEL_ENABLED: 'false'
          RESILIENCE_ENABLED: 'false'
          # Entra BFF OIDC — CI test-only placeholders (never used for real auth).
          ENTRA_TENANT_ID: ci-test-tenant
          ENTRA_CLIENT_ID: ci-test-client
          ENTRA_CLIENT_SECRET: ci-test-secret
          ENTRA_REDIRECT_URI: http://localhost:3000/v1/bff/callback

      # The SPA's API client is generated from this very spec and COMMITTED, so it can
      # silently fall behind a DTO change — and nothing else notices. `tsc` does not: on an
      # incremental build it can pass against stale build info, and a route the client has
      # never heard of only fails at runtime as `Cannot POST /v1/...`. Regenerating here and
      # diffing is the cheapest possible proof that the two agree.
      #
      # Runs against the spec file just captured, not a live server, so it is deterministic.
      # Fix a failure with `pnpm --filter rally-web codegen` against a local API, then commit.
      - name: Generated web client matches the spec
        run: pnpm --filter rally-web codegen:check
        env:
          OPENAPI_SPEC: ${{ github.workspace }}/openapi.json

      - name: Upload OpenAPI spec artifact
        uses: quynhonsemiconductor/ci/actions/publish-openapi-spec@v1
        with:
          spec-path: openapi.json
          artifact-name: openapi-spec-${{ github.sha }}
          retention-days: "30"

      # On PRs: download the base-branch spec and diff for breaking changes.
      - name: Download base spec
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7  # v24
        continue-on-error: true   # first PR has no base artifact yet
        with:
          workflow: ci.yml
          branch: ${{ github.base_ref }}
          name: openapi-spec-${{ github.event.pull_request.base.sha }}
          path: base-spec/

      - name: Breaking change check
        if: github.event_name == 'pull_request'
        uses: quynhonsemiconductor/ci/actions/validate-openapi-contract@v1
        with:
          current-spec-path: openapi.json
          base-spec-path: base-spec/openapi.json
          fail-on-breaking: "true"

  # Security scans (Trivy, CodeQL) → security.yml
