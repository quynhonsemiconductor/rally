# =============================================================================
# Backend · Deploy — thin caller of the shared reusable (qnsc-ci).
#
# Triggers:
#   develop → push to main (auto)
#   prod    → push a semver tag v*.*.*  (gated by the "production" GitHub
#             Environment's required reviewer, enforced inside the reusable)
#
# The reusable builds/attests on main, promotes the exact dev image on tag,
# migrates, then rolls the ECS services. All ECS_*/RDS/APP_URL config is read
# from env-scoped GitHub vars; only the AWS account id (+ optional Slack webhook)
# are passed explicitly to the reusable (least-privilege, no `secrets: inherit`).
# =============================================================================
name: Backend · Deploy

on:
  push:
    branches: [main]
    # Skip the develop build+deploy when a merge touches ONLY paths this service
    # doesn't ship: docs and the web app. paths-ignore fires only if EVERY changed
    # file matches — a shared change (libs, db, root lockfile) still deploys, so
    # under-deploy is impossible. Release tags always change package.json +
    # manifest (root, never ignored) → prod never skipped.
    #
    # `infra/**` is deliberately NOT ignored, though it once was. Terraform owns
    # the task definition's environment (REDIS_URL, DATABASE_*, CORS_ORIGINS, …),
    # but the ecs-service module sets `ignore_changes = [task_definition]` so the
    # SERVICE is never moved onto the revision Terraform registers — the deploy
    # pipeline owns that. With infra ignored here, an infra-only merge registered a
    # new task definition that nothing ever rolled onto, and the change silently
    # did not take effect. That is how develop ended up running against a DELETED
    # cache endpoint (`valkey: down` on /v1/readyz) after the cache migration:
    # the apply succeeded, the new definition was correct, and no deploy ran.
    #
    # Rolling the service from infra-apply instead would be worse: Terraform's
    # newest revision carries a new IMAGE, so rolling onto it would ship app code
    # ahead of `Run database migrations`. Deploying through this pipeline keeps
    # migrations, attestation and health checks in the loop, and `wait-for-infra`
    # below already sequences it after the apply for the same commit.
    #
    # Cost: a Terraform-only merge now rebuilds images it does not strictly need.
    # That is minutes of CI in exchange for removing a class of silent drift.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'apps/web/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # semver only — no -rc suffix

  # Manual redeploy of whatever main currently holds. DEVELOP ONLY — a prod deploy
  # still requires a semver tag, so this cannot be used to skip that gate.
  #
  # Exists because a merged backend fix can otherwise become undeployable. #358 hit
  # exactly that: its Backend · CI run was CANCELLED when the next PR merged seconds
  # later, and the deploy gate below fails closed on a missing CI run — correctly.
  # Re-running the deploy cannot help (the cancelled CI run is what is missing), and
  # every PR that followed was apps/web, which paths-ignore skips. The fix sat on main,
  # undeployed, while develop kept serving the broken image.
  #
  # An empty commit does NOT work as a substitute: paths-ignore is evaluated against the
  # changed-file list, and a commit that changes nothing matches every ignore rule.
  workflow_dispatch:

concurrency:
  # Serialize by ENVIRONMENT, not raw ref: all prod (tag) deploys share one
  # group so prod DB migrations never run concurrently; develop shares another.
  # prod and develop still run in parallel (different groups).
  group: deploy-backend-${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'develop' }}
  cancel-in-progress: false   # never cancel a running deploy

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Ordering gate — never roll the app ahead of its own infrastructure.
  #
  # Backend·Deploy and Infrastructure·Apply both fire on the same push, as
  # independent workflows. Nothing sequenced them, so a commit that changes BOTH
  # infra and app code raced: the deploy registered/ran tasks against the OLD
  # task definition while the new one was still being applied.
  #
  # That is how the DATABASE_USER/PASSWORD migration would have failed — the
  # migrator would have run with the previous task definition, still pointing at
  # the retired db-url secret, and reported a confusing auth error.
  #
  # Deterministic by design:
  #   - commit does NOT touch infra/live/** → no infra run exists, proceed at once
  #   - commit DOES touch infra/live/**     → wait for that run on THIS sha
  # It keys on the commit sha, so it can never wait on an unrelated run.
  # ───────────────────────────────────────────────────────────────────────────
  wait-for-infra:
    name: Wait for infrastructure
    runs-on: ubuntu-latest
    # Generous: on a tag this waits for apply-prod, which sits behind the
    # `production` environment's required reviewer. Timing out here is safe —
    # the deploy is re-runnable — but it should not fire just because an
    # approver stepped away.
    timeout-minutes: 120
    # Least-privilege: read the commit and query sibling runs. Nothing else.
    # Explicit so an org-level default change cannot silently break the gate.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Does this commit change infrastructure?
        id: touched
        run: |
          # Tags ALWAYS gate. infra-apply's apply-prod job is `if: ref_type ==
          # 'tag'`, so a tag is the ONLY thing that applies prod infra — and the
          # prod deploy fires on the same tag. Without gating here they race, and
          # the prod migrator runs against the PREVIOUS task definition. Path
          # filters are also not applied to tag pushes, so infra-apply always
          # runs for a tag regardless of what the commit touched.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "infra=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # infra/modules/** counts too: `module "stack"` is a LOCAL path module, so a
          # module-only commit changes the plan and now triggers infra-apply. Matching
          # only infra/live/ here would let the deploy race ahead of that apply —
          # exactly the failure the paths-ignore comment above describes.
          if git diff --name-only HEAD~1 HEAD | grep -qE '^infra/(live|modules)/'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Infrastructure · Apply on this commit
        if: steps.touched.outputs.infra == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The sibling run may not be registered the instant this job starts;
          # allow a short grace period before concluding there is none.
            # `|| ID=""` keeps a transient gh/API failure from ending the step: these
            # runners use `set -e`, and an assignment takes its command substitution's
            # exit status, so a rate-limited or flaky `gh run list` skipped the retry
            # loop entirely and turned a recoverable blip into a failed gate.
          for _ in $(seq 1 12); do
            ID=$(gh run list --workflow=infra-apply.yml --commit "$GITHUB_SHA" \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty') || ID=""
            [ -n "$ID" ] && break
            sleep 10
          done

          if [ -z "${ID:-}" ]; then
            echo "::warning::infra/live changed but no Infrastructure · Apply run found for $GITHUB_SHA — proceeding."
            exit 0
          fi

          echo "Waiting on infra-apply run $ID …"
          gh run watch "$ID" --exit-status
          echo "Infrastructure applied; deploy may proceed."

  # ───────────────────────────────────────────────────────────────────────────
  # CI gate — a red main must not deploy.
  #
  # Block the develop (push-to-main) deploy until the "Backend · CI" run for THIS
  # commit has finished successfully. Keys on the commit sha, so it can never
  # wait on an unrelated run. Same shape as wait-for-infra above.
  #
  #   - push to main → wait for Backend · CI on this sha; `gh run watch
  #     --exit-status` propagates its conclusion, so a failed CI blocks deploy.
  #   - tag push → wait for the DEVELOP deploy of this sha instead. See below.
  #
  # Fails closed: if no CI run is found for the sha, block rather than ship blind.
  #
  # WHY THE TAG BRANCH WAITS ON THE DEVELOP DEPLOY, AND NO LONGER EXITS 0.
  # It used to `exit 0` with "Backend · CI gate not applicable", which is true on its
  # own terms — Backend · CI runs on main, not on tags, so there is no CI run to await.
  # But it left prod with no gate at all, and a prod deploy does not build: it PROMOTES
  # the sha-<sha> image the develop deploy pushed. So the tag run's real precondition is
  # not CI, it is "develop already built and deployed this sha" — exactly what the
  # promote action's own failure message states ("The commit must be merged to main and
  # deployed to develop before tagging a release").
  #
  # With no gate, the two runs raced, and on v0.7.13 (2026-08-31) prod lost. A release
  # merge fires both runs on the same commit; the tag run cleared this gate in 3 seconds
  # while the main run sat here for 15m16s waiting on Backend · CI. Prod then spent the
  # promote step's poll budget waiting for an image that did not exist yet and failed
  # with "rally-api:sha-908d13cb… not found in ECR" — 21 seconds before this gate even
  # cleared on the main run. Nothing half-deployed (promote runs before the deploy job,
  # and it is idempotent), but the release needed a manual re-run.
  #
  # Waiting on the whole develop RUN, not just its build jobs, is deliberate: it is the
  # documented contract, it is one `gh run watch` rather than per-job polling, and it
  # means prod can never ship an image develop itself failed to deploy. The cost is
  # roughly the develop deploy's own duration (~5 min beyond the build) added to prod's
  # start, which the "production" Environment reviewer gate dwarfs anyway.
  #
  # NOT-FOUND WARNS RATHER THAN BLOCKING, unlike the main branch below. The `on:` block
  # above guarantees a release tag always produces a develop run (package.json and the
  # manifest are never in paths-ignore), so absence means something unusual — a hand-cut
  # tag on a docs-only commit, or a deleted run — and the promote step's ECR poll is
  # still there as the backstop. Blocking would turn this gate into a new way to make a
  # release un-shippable. Same warn-and-proceed shape as wait-for-infra above. A develop
  # run that EXISTS and FAILED does block, which is the diagnostic this adds: prod now
  # says "develop deploy failed" in seconds instead of "not found in ECR" in ~17 min.
  # ───────────────────────────────────────────────────────────────────────────
  wait-for-ci:
    name: Wait for Backend · CI
    runs-on: ubuntu-latest
    # 45, not 30: the tag branch now awaits the develop deploy, which took 24m24s on
    # v0.7.13 (11:03:06 → 11:27:30) — inside 30 but with only ~5 min to spare, and its
    # own slowest input is a Docker build whose cache a lockfile change invalidates.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for Backend · CI on this commit
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This job does not check out the repo, so `gh` cannot infer it from a
          # local remote — pass it explicitly.
          for _ in $(seq 1 12); do
            ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow backend-ci.yml \
                   --branch main --commit "$GITHUB_SHA" \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty') || ID=""
            [ -n "$ID" ] && break
            sleep 10
          done
          if [ -z "${ID:-}" ]; then
            echo "::error::No Backend · CI run found for $GITHUB_SHA — blocking deploy (fail closed)."
            exit 1
          fi
          echo "Waiting on Backend · CI run $ID …"
          gh run watch --repo "$GITHUB_REPOSITORY" "$ID" --exit-status
          echo "Backend · CI succeeded; deploy may proceed."

      # Prod promotes the image the develop deploy pushed, so this is the tag run's
      # real precondition. See the block comment above this job for the race it closes.
      - name: Wait for the develop deploy of this commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `--branch main` is what excludes THIS run: the develop deploy's headBranch is
          # `main` while the tag run's is the tag ref, so the two never match each other
          # despite sharing a workflow file and a commit. Without it this would find
          # itself and wait forever.
          #
          # `|| ID=""` on the assignment, matching wait-for-infra above and for the same
          # reason: runners use `set -e`, an assignment takes its command substitution's
          # exit status, so a rate-limited `gh run list` would skip the retry loop.
          for _ in $(seq 1 12); do
            ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow backend-deploy.yml \
                   --branch main --commit "$GITHUB_SHA" \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty') || ID=""
            [ -n "$ID" ] && break
            sleep 10
          done

          if [ -z "${ID:-}" ]; then
            echo "::warning::No develop Backend · Deploy run found for $GITHUB_SHA — proceeding, the promote step's ECR poll is the backstop."
            exit 0
          fi

          echo "Waiting on develop Backend · Deploy run $ID …"
          if ! gh run watch --repo "$GITHUB_REPOSITORY" "$ID" --exit-status; then
            echo "::error::The develop deploy of $GITHUB_SHA did not succeed (run $ID). Prod promotes the image that run pushes, so there is nothing to promote. Fix develop, then re-run this deploy."
            exit 1
          fi
          echo "Develop deployed this commit; the sha image exists and prod may promote it."

  deploy:
    needs: [wait-for-infra, wait-for-ci]
    # Must match the UNION of every inner job's own permissions in the reusable
    # backend-deploy.yml, not just its top-level default (contents: read) —
    # GitHub validates a reusable call's whole permission chain at trigger
    # time, and a caller job that only grants the top-level default causes a
    # startup_failure before any job runs, not a runtime denial on the one
    # inner job that needed more. id-token/attestations are for the build and
    # promote jobs' AWS OIDC + provenance attestation steps.
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: read # build-push-ecr pulls private @quynhonsemiconductor/* from GitHub Packages
    uses: quynhonsemiconductor/ci/.github/workflows/backend-deploy.yml@v1
    with:
      product: rova
      has_worker: true
      has_migrator: true
      # ── Graviton ───────────────────────────────────────────────────────────
      # ARM64 Fargate is ~20% cheaper per vCPU-hour and GB-hour at identical sizing.
      #
      # These two MOVE WITH `cpu_architecture` in infra/live/*/main.tf, in one change.
      # Set only one side and the container fails at task start with "image Manifest does
      # not contain descriptor matching platform" — after a clean apply and a deploy that
      # reports a rollout, so nothing warns you until tasks refuse to run.
      #
      # NATIVE ARM RUNNER, not QEMU emulation on ubuntu-latest. The reusable's own note is
      # explicit: emulating an arm64 pnpm + Nest compile multiplies build minutes by enough
      # to outweigh the Fargate saving. `ubuntu-24.04-arm` is free on public repositories.
      #
      # Every image in the task has an arm64 build — node:alpine for the app,
      # cloudflare/cloudflared and amazon/aws-otel-collector for the sidecars (checked
      # 2026-08-17). qnsc-kb cannot do this: clamav/clamav is amd64-only on every tag.
      build_runner: ubuntu-24.04-arm
      image_platforms: linux/arm64
    # Least-privilege: pass only what the reusable declares (no `secrets: inherit`).
    secrets:
      AWS_ACCOUNT_ID:       ${{ vars.AWS_ACCOUNT_ID }}

  # ───────────────────────────────────────────────────────────────────────────
  # Deploy annotation — a vertical marker on every Grafana dashboard panel
  # showing exactly when this deploy landed, so a metric spike can be
  # correlated to a release at a glance instead of cross-referencing commit
  # times by hand. Uses the SAME org-level GRAFANA_ALERTS_TOKEN this repo's
  # Terraform alerting/dashboards already authenticate with (Admin-scoped,
  # covers annotation writes) — no new credential.
  #
  # A SEPARATE job here, not a step inside `deploy`: the actual deploy steps
  # live in qnsc-ci's shared reusable workflow, a different repo, not edited
  # by this change. Own repo, own job — matches how this repo's dashboard/
  # alerting Terraform already lives here rather than in the shared module
  # family (see infra/modules/stack's own reasoning).
  #
  # Deliberately best-effort: `continue-on-error` on the one step that can
  # fail, so a Grafana outage or a bad token never fails a real deploy over
  # a marker nobody's on-call rotation depends on being able to trust.
  annotate-deploy:
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post deploy annotation to Grafana
        continue-on-error: true
        env:
          GRAFANA_ALERTS_TOKEN: ${{ secrets.GRAFANA_ALERTS_TOKEN }}
          DEPLOY_ENV: ${{ github.ref_type == 'tag' && 'production' || 'develop' }}
        run: |
          curl -sf -X POST "https://qnsc.grafana.net/api/annotations" \
            -H "Authorization: Bearer ${GRAFANA_ALERTS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
                  --arg text "rally deployed ${GITHUB_SHA:0:7} to ${DEPLOY_ENV}" \
                  --arg env "$DEPLOY_ENV" \
                  '{tags: ["deploy", "rally", $env], text: $text}')"
