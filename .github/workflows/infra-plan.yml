# =============================================================================
# Infrastructure · Plan — thin caller of the shared reusable (qnsc-ci).
# Dry-run on every PR touching infra/live/**; posts a plan comment per changed
# workspace and gates on `tofu fmt`.
# =============================================================================
name: Infrastructure · Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/live/**"
      # modules/** matters too: `module "stack"` is a LOCAL path module, so editing it
      # changes the plan for both environments. Without this a module-only PR merged
      # with no plan reviewed at all, and infra-apply (same filter) then skipped it.
      - "infra/modules/**"
      - ".github/workflows/infra-plan.yml"

# Granted at the caller so the reusable can request them (a reusable workflow
# can never exceed the caller's token). id-token:write is mandatory for the
# OIDC AssumeRole; without an explicit grant it defaults to `none` and GitHub
# rejects the whole workflow at compile time ("0 jobs" run failure).
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    uses: quynhonsemiconductor/ci/.github/workflows/infra-plan.yml@v1
    with:
      product: rova
      # Mirror the apply-time NON-secret TF_VARs so plan ≈ apply. Without
      # cloudflare_account_id the count-gated Cloudflare Pages module resolves to
      # 0, so every plan shows a phantom `module.web[0]` destroy; without the
      # entra_* ids the api/worker task defs show spurious env diffs. Omitting
      # these turns real destroys into noise a reviewer can miss. image_tag is
      # deliberately NOT passed — it's only known at release/apply time (prod
      # pins the release tag), so a task-def revision bump on plan is expected.
      # Entra tenant/client id, the GitHub App id and the Cloudflare account id are
      # PUBLIC identifiers and now live in infra/live/*/variables.tf. They used to be
      # passed from Actions variables, which made this job lie: ENTRA_CLIENT_ID is
      # environment-scoped and a plan job has no `environment:` context (adding one
      # would gate every PR behind the production reviewer), so it resolved to "" and
      # every plan reported three ECS task definitions "must be replaced". Held in
      # git, plan and apply see the same value and the plan tells the truth.
    secrets:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      # Lets the reusable mint a RELEASE_BOT token to fetch the private qnsc-tf-modules.
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      # Secret half of the apply-time TF_VARs (masked inside the reusable).
      tf_secret_vars_json: |
        {
          "cloudflare_api_token": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
          "grafana_alerting_auth": "${{ secrets.GRAFANA_ALERTS_TOKEN }}"
        }
