services:
  postgres:
    image: postgres:17-alpine
    container_name: rova-postgres
    environment:
      POSTGRES_DB: rova_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: rova-valkey
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # LocalStack for AWS services (SQS/SNS/S3/Secrets) in dev.
  # Replaces real AWS for local development — no AWS account needed.
  # Production AWS resources live in the rally-infra repo (Terraform).
  localstack:
    image: localstack/localstack:4
    container_name: rova-localstack
    environment:
      AWS_DEFAULT_REGION: ap-southeast-1
      PERSISTENCE: 1
      # Standard fake credentials — required by AWS SDK v3 even against LocalStack
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - '4566:4566'
    volumes:
      - localstack_data:/var/lib/localstack
      # Init hook: runs automatically when LocalStack is ready.
      # Creates SNS topic, SQS queues, DLQs, and SNS→SQS subscriptions.
      # Mirrors how db/init/ bootstraps Postgres on first start.
      - ./scripts/localstack:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ['CMD', 'awslocal', 's3api', 'list-buckets']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  otel:
    image: otel/opentelemetry-collector-contrib:0.140.1
    container_name: rova-otel
    command: ['--config=/etc/otel/collector.yaml']
    volumes:
      - ./scripts/otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      # DEFAULT ports here; opshub offsets to 4319/8890 so both stacks can run at once.
      - '4318:4318'
      - '8889:8889'
    healthcheck:
      # The image has no shell and no curl, so run the binary's own subcommand instead.
      test: ['CMD', '/otelcol-contrib', 'components']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  localstack_data:
